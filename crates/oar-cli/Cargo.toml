[package]
name = "oar-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OAR base system - user commands (oarsub, oarstat)"

[lib]
name = "oar_cli"
path = "src/lib.rs"

[[bin]]
name = "oarsub"
path = "src/oarsub.rs"

[[bin]]
name = "oarstat"
path = "src/oarstat.rs"

[dependencies]
oar-proto = { workspace = true }
oar-common = { workspace = true }

clap = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
oar-client = { workspace = true }

async-trait = { workspace = true }
tempfile = { workspace = true }
